# SignalHunter whitelist rules
#
# Whitelisted processes are not hidden. Their telemetry, scores, and case data
# can still be logged, but score deltas are reduced by --whitelist-percent.
#
# Supported keys:
#   comm=<exact process comm>
#   comm_contains=<substring>
#   exe=<exact executable path>
#   exe_prefix=<path prefix>
#   exe_contains=<substring>
#   pid=<pid>
#
# Browser/JIT defaults are built in, but examples are kept here for clarity.
comm_contains=firefox
comm_contains=Web Content
comm_contains=Isolated Web Co
comm_contains=chrome
comm_contains=chromium
exe_contains=/firefox
exe_contains=/chrome
exe_contains=/chromium
