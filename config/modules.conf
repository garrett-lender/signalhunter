# SignalHunter module configuration
#
# Built-in modules can be disabled here without recompiling:
#   builtin.whitelist=off
#   builtin.proc_connector=off
#   builtin.fanotify=off
#   builtin.ebpf=off
#
# Dynamic plugins can be loaded in two ways:
#   plugin_dir=plugins
#   plugin=plugins/example_heartbeat.so
#
# The default plugin directory is also controlled by --plugin-dir.
plugin_dir=plugins
